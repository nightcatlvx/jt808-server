spring:
  application:
    name: jt808
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
  mvc:
    format:
      date-time: yyyy-MM-dd HH:mm:ss
      date: yyyy-MM-dd
      time: HH:mm:ss

mybatis-plus:
  configuration:
    use-generated-keys: true
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  mapper-locations:
    - classpath:/mapper/*.xml

server:
  port: 28101

jt-server:
  jt808:
    tcp-port: 27101
    udp-port: 27101
    idle-timeout: 180
    message-package: org.yzh.protocol
    t0801:
      path: /jt_data/media_file
    t9208:
      host: 0.0.0.0
      port: 27201
      enabled: false
      path: /jt_data/alarm_file
    t9206:
      host: 127.0.0.1
      port: 21
      username: test
      password: test
    t9101:
      enabled: false
      rtmp: true
      port: 7078
      public-port: 27078
      host: 0.0.0.0
      zlm-host: 172.18.0.3
      zlm-rtp-port: 10000
      zlm-rtmp-port: 1935
      # 流名模板，支持占位符 {client_id}、{channel_no}
      # 注意：流名中不能含 "/"，否则 HTTP-FLV (/live/<stream>.flv) URL 路由会被截断 → 404
      # 推荐用 "_" 分隔。HLS 仍可播是因为它生成嵌套目录，但 FLV/WS-FLV 必须单段
      # 播放地址：rtmp://<zlm-host>:<zlm-rtmp-port>/live/<client_id>_<channel_no>
      stream-name: "{client_id}_{channel_no}"
      # 是否推送音频。设为 false 时所有音频包静默丢弃，仅推视频
      # 已支持编码：G.711A(PT=6) / G.711U(PT=7) / AAC(PT=19，自动解析 ADTS 构造 ASC)
      audio-enabled: true
